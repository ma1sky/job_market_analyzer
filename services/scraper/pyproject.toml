[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "service-scraper"
version = "0.1.0"
description = "Job vacancy scraper for Job Market Analyzer"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.setuptools.packages.find]
include = ["app*", "sources*"]