[project]
name = "scraper"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Artem Maysky", email = "gutsalenko1005@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "shared",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
scraper = "scraper:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.uv.sources]
shared = { workspace = true }
