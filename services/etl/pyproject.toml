[project]
name = "etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Maysky", email = "gutsalenko1005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "shared",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
etl = "etl:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
shared = { workspace = true }
